<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>שאלון הכנה לשיחה</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23C5963A'/%3E%3Ctext x='50' y='66' font-size='55' text-anchor='middle'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css?v=1" />
</head>
<body>

  <!-- שער כניסה - סיסמה זמנית, תקפה 30 דקות ממועד יצירת הקישור -->
  <div id="gate-overlay" class="gate-overlay">
    <div class="gate-box">
      <div class="gate-icon">🔒</div>
      <h1 class="gate-title">שאלון הכנה לשיחה</h1>
      <p class="gate-message">הזיני את הסיסמה שקיבלת כדי להתחיל.</p>
      <form id="gate-form" class="gate-form">
        <input id="gate-password" type="password" class="gate-input" placeholder="סיסמה" autocomplete="off" />
        <button type="submit" class="btn btn-primary">כניסה</button>
      </form>
      <div id="gate-error" class="gate-error"></div>
      <div id="gate-countdown" class="gate-countdown"></div>
    </div>
  </div>

  <!-- הסיסמה פגה - אחרי 30 דקות מיצירת הקישור, גם עם סיסמה נכונה -->
  <div id="expired-overlay" class="gate-overlay is-hidden">
    <div class="gate-box">
      <div class="gate-icon">⏳</div>
      <h1 class="gate-title">הקישור פג תוקף</h1>
      <p class="gate-message">קישור זה כבר אינו בתוקף. יש לבקש מהמטפלת קישור חדש.</p>
    </div>
  </div>

  <!-- גוף השאלון -->
  <div id="app-shell" class="app-shell is-hidden">
    <header class="fill-header">
      <div id="fill-timer-widget" class="fill-timer">⏱ <span id="fill-timer-display">30:00</span></div>
    </header>
    <main id="exercise-root" class="exercise-root"></main>
  </div>

  <!-- מסך סיום -->
  <div id="done-screen" class="gate-overlay is-hidden">
    <div class="gate-box done-box">
      <div class="gate-icon">🎉</div>
      <h1 class="gate-title">סיימת בהצלחה!</h1>
      <p class="gate-message">אפשר לייצא עכשיו את התשובות לקובץ PDF, ולשלוח אותו למטפלת לפני השיחה.</p>
      <button id="export-pdf-btn" type="button" class="btn btn-primary btn-export">ייצוא ל-PDF כעת</button>
    </div>
  </div>

  <!-- טיימר המילוי נגמר - נעילה מלאה של המשך הקלדה -->
  <div id="locked-out-screen" class="gate-overlay is-hidden">
    <div class="gate-box">
      <div class="gate-icon">⏰</div>
      <h1 class="gate-title">הזמן הסתיים</h1>
      <p class="gate-message">30 הדקות למילוי השאלון הסתיימו, ולא ניתן להמשיך להקליד.</p>
    </div>
  </div>

  <div id="pdf-export-mount" class="pdf-export-mount"></div>

  <script src="../vendor/html2pdf.bundle.min.js"></script>
  <script src="js/content.js?v=1"></script>
  <script src="js/dom.js?v=1"></script>
  <script src="js/gate.js?v=1"></script>
  <script src="js/filltimer.js?v=1"></script>
  <script src="js/exercises.js?v=1"></script>
  <script src="js/pdfexport.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
</body>
</html>
