<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>יומן אישי של עדיה</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235e548e'/%3E%3Ctext x='50' y='66' font-size='55' text-anchor='middle'%3E%F0%9F%93%93%3C/text%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="site-shell">
    <header class="top-bar">
      <button id="sidebar-toggle" class="sidebar-toggle-btn" type="button" title="תפריט">☰</button>
      <h1 id="site-title" class="site-title">יומן אישי של עדיה</h1>
    </header>

    <div id="sidebar-overlay" class="sidebar-overlay is-hidden"></div>
    <nav id="sidebar-panel" class="sidebar-panel is-hidden">
      <button class="sidebar-item" type="button" data-section="journal">📔 יומן הערכה</button>
      <button class="sidebar-item" type="button" data-section="summaries">📝 סיכומים</button>
      <button class="sidebar-item" type="button" data-section="decisions">💬 החלטות עסקיות חשובות</button>
    </nav>

    <main class="site-main">
      <section id="dashboard-view" class="app-section">
        <div class="dashboard-empty">
          <p>לוח הבקרה שלך יופיע כאן בהמשך.</p>
          <p class="dashboard-hint">פתחי את התפריט (☰) כדי לגשת ליומן ההערכה, לסיכומים או להחלטות העסקיות.</p>
        </div>
      </section>

      <section id="journal-view" class="app-section is-hidden">
        <header class="app-header">
          <div class="header-tools-row">
            <button id="insights-btn" type="button" class="util-btn" title="הצגת תובנות מ-30 הימים האחרונים">📊 ניתוח חודשי</button>
            <div class="timer-widget">
              <button id="timer-reset" type="button" class="util-btn timer-btn" title="איפוס הטיימר">↺</button>
              <span id="timer-display" class="timer-display">40:00</span>
              <button id="timer-toggle" type="button" class="util-btn timer-btn" title="הפעלה/השהיה">▶</button>
            </div>
          </div>
          <h2 class="app-title">יומן הערכה</h2>
          <p class="app-subtitle">רגע אחד ביום, לעצמך</p>
          <div class="utility-bar">
            <div class="utility-group">
              <button id="font-dec" type="button" class="util-btn" title="הקטנת טקסט">א−</button>
              <button id="font-inc" type="button" class="util-btn" title="הגדלת טקסט">א+</button>
            </div>
            <div class="utility-group">
              <button id="backup-btn" type="button" class="util-btn" title="גיבוי כל הנתונים לקובץ">⭱ גיבוי</button>
              <button id="restore-btn" type="button" class="util-btn" title="שחזור נתונים מקובץ גיבוי">⭳ שחזור</button>
              <input id="restore-file" type="file" accept="application/json" hidden />
            </div>
          </div>
        </header>

        <nav class="tab-nav" id="tab-nav"></nav>
        <main id="tab-content"></main>
      </section>

      <section id="summaries-view" class="app-section is-hidden"></section>

      <section id="decisions-view" class="app-section is-hidden"></section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/prefs.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/renderers.js"></script>
  <script src="js/celebrate.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/richtext.js"></script>
  <script src="js/summaries.js"></script>
  <script src="js/decisions.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
