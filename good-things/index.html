<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>הדברים הטובים שהיום התמקדתי בהם</title>
<link rel="icon" href="https://i.imghippo.com/files/FG7949RSw.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css?v=1" />
</head>
<body>

  <main id="screen-fill" class="screen">
    <img src="https://i.imghippo.com/files/FG7949RSw.png" alt="לוגו" class="site-logo" />
    <h1 class="main-title">הדברים הטובים שהיום התמקדתי בהם...</h1>

    <div id="rows-wrap" class="rows-wrap"></div>

    <p id="count-label" class="count-label">0 הזנות התקבלו</p>

    <button id="continue-btn" type="button" class="btn-continue" disabled>בחרתי לראות היום הרבה טוב</button>
  </main>

  <main id="screen-done" class="screen is-hidden">
    <img src="https://i.imghippo.com/files/FG7949RSw.png" alt="לוגו" class="site-logo" />
    <div id="confetti-layer" class="confetti-layer"></div>
    <p class="done-text">
      את <span class="done-highlight">מדהימה</span>,<br />
      בחרת לראות היום <span id="done-count">0</span> דברים טובים
    </p>
  </main>

  <script src="js/app.js?v=1"></script>
</body>
</html>
